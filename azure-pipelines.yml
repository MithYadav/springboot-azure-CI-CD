trigger:
  - main
  - master

pool:
  name: 'Default'  # Use self-hosted agent
  # vmImage: 'ubuntu-latest'  # Uncomment this after Microsoft approves parallelism

variables:
  dockerHubUsername: 'learndocker0118'  # CHANGE THIS to your Docker Hub username
  imageName: 'springboot-app'
  azureSubscription: 'AzureConnection'
  webAppName: 'springboot-cicd-mith'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: Build
    displayName: 'Build Spring Boot Application'
    steps:
    
    # Build Spring Boot JAR with Maven
    - task: Maven@3
      displayName: 'Maven Build'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        options: '-DskipTests'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.21'
        mavenVersionOption: 'Default'
    
    # Build and Push Docker Image to Docker Hub
    - task: Docker@2
      displayName: 'Build and Push to Docker Hub'
      inputs:
        containerRegistry: 'DockerHubConnection'
        repository: '$(dockerHubUsername)/$(imageName)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(tag)
          latest
    
    # Show success message
    - script: |
        echo "✅ Build completed successfully!"
        echo "Docker image: $(dockerHubUsername)/$(imageName):$(tag)"
      displayName: 'Build Summary'

